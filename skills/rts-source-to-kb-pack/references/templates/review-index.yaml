schema_version: review-index-v1
pack_id: "{pack_id}"
decisions:
  - decision_id: "{decision_id}"
    object_refs:
      - "{object_id}"
    claim_refs:
      - "{claim_id}"
    decision_type: requires_user_confirmation
    status: open
    question_or_conflict: "{question_or_conflict}"
    decision: null
    decided_by: null
    decided_at: null
    evidence_refs:
      - "{evidence_id}"
    remaining_risk:
      - "{risk}"
    production_gate: blocked
findings:
  - finding_id: "{finding_id}"
    finding_type: unsupported_claim
    severity: blocking
    object_refs: []
    claim_refs: []
    source_refs: []
    status: open
    description: "{description}"
    required_action: "{required_action}"
